<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 330" width="1000" height="330" role="img" aria-label="Interpreter vs dynarec"><title>Interpreter vs dynarec</title><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker><filter id="sh" x="-5%" y="-5%" width="110%" height="120%"><feDropShadow dx="0" dy="1.5" stdDeviation="1.6" flood-color="#0f172a" flood-opacity="0.12"/></filter></defs><rect x="0" y="0" width="1000" height="330" rx="16" fill="#ffffff"/><rect x="20" y="20" width="470" height="290" rx="14" fill="#f8fafc" fill-opacity="0.55" stroke="#64748b" stroke-width="1.4" stroke-dasharray="2 0"/><text x="34" y="42" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Roboto, sans-serif" font-size="13" font-weight="700" fill="#64748b" text-anchor="start">Interpreter  ·  execute_arm</text><text x="255" y="60" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Roboto, sans-serif" font-size="12" font-weight="400" fill="#475569" text-anchor="middle">pays fetch + decode + dispatch on EVERY instruction, every frame</text><rect x="60" y="90" width="170" height="64" rx="10" fill="#f8fafc" stroke="#64748b" stroke-width="1.6" filter="url(#sh)"/><text x="145.0" y="115.0" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Roboto, sans-serif" font-size="14" font-weight="650" fill="#1e293b" text-anchor="middle">fetch</text><text x="145.0" y="135.0" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Roboto, sans-serif" font-size="12" font-weight="400" fill="#1e293b" text-anchor="middle">next ARM/Thumb opcode</text><rect x="280" y="90" width="170" height="64" rx="10" fill="#f8fafc" stroke="#64748b" stroke-width="1.6" filter="url(#sh)"/><text x="365.0" y="115.0" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Roboto, sans-serif" font-size="14" font-weight="650" fill="#1e293b" text-anchor="middle">decode</text><text x="365.0" y="135.0" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Roboto, sans-serif" font-size="12" font-weight="400" fill="#1e293b" text-anchor="middle">big switch in C</text><rect x="170" y="210" width="170" height="64" rx="10" fill="#f8fafc" stroke="#64748b" stroke-width="1.6" filter="url(#sh)"/><text x="255.0" y="235.0" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Roboto, sans-serif" font-size="14" font-weight="650" fill="#1e293b" text-anchor="middle">execute</text><text x="255.0" y="255.0" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Roboto, sans-serif" font-size="12" font-weight="400" fill="#1e293b" text-anchor="middle">C code per opcode</text><path d="M230,122 L278,122" fill="none" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#ah)"/><path d="M365,156 L300,208" fill="none" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#ah)"/><path d="M200,208 L140,158" fill="none" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#ah)"/><rect x="510" y="20" width="470" height="290" rx="14" fill="#f0fdf4" fill-opacity="0.55" stroke="#16a34a" stroke-width="1.4" stroke-dasharray="2 0"/><text x="524" y="42" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Roboto, sans-serif" font-size="13" font-weight="700" fill="#16a34a" text-anchor="start">Dynarec  ·  execute_arm_translate</text><text x="745" y="60" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Roboto, sans-serif" font-size="12" font-weight="400" fill="#475569" text-anchor="middle">pays them ONCE per block, then runs native Xtensa code</text><rect x="540" y="90" width="410" height="64" rx="10" fill="#fff7ed" stroke="#ea580c" stroke-width="1.6" filter="url(#sh)"/><text x="745.0" y="115.0" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Roboto, sans-serif" font-size="14" font-weight="650" fill="#7c2d12" text-anchor="middle">first time a block is reached</text><text x="745.0" y="135.0" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Roboto, sans-serif" font-size="12" font-weight="400" fill="#7c2d12" text-anchor="middle">decode it once, write Xtensa code into the cache</text><rect x="540" y="210" width="410" height="64" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.6" filter="url(#sh)"/><text x="745.0" y="235.0" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Roboto, sans-serif" font-size="14" font-weight="650" fill="#14532d" text-anchor="middle">every other time</text><text x="745.0" y="255.0" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Roboto, sans-serif" font-size="12" font-weight="400" fill="#14532d" text-anchor="middle">jump straight into the generated code (blocks chain)</text><path d="M745,156 L745,208" fill="none" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#ah)"/><rect x="692.8" y="170.5" width="104.39999999999999" height="21" rx="6" fill="#ffffff" fill-opacity="0.95"/><text x="745" y="186.5" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Roboto, sans-serif" font-size="11.5" font-weight="400" fill="#475569" text-anchor="middle">translate once</text></svg>
