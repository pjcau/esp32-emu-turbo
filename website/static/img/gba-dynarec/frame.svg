<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="1000" height="600" role="img" aria-label="How a frame runs"><title>How a frame runs</title><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker><filter id="sh" x="-5%" y="-5%" width="110%" height="120%"><feDropShadow dx="0" dy="1.5" stdDeviation="1.6" flood-color="#0f172a" flood-opacity="0.12"/></filter></defs><rect x="0" y="0" width="1000" height="600" rx="16" fill="#ffffff"/><rect x="25" y="20" width="170" height="56" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6" filter="url(#sh)"/><text x="110.0" y="40.5" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Roboto, sans-serif" font-size="13" font-weight="650" fill="#1e3a8a" text-anchor="middle">frame loop</text><text x="110.0" y="59.5" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Roboto, sans-serif" font-size="12" font-weight="400" fill="#1e3a8a" text-anchor="middle">core 0</text><path d="M110,78 L110,580" stroke="#2563eb" stroke-width="1.5" stroke-dasharray="4 5" opacity="0.6"/><rect x="215" y="20" width="170" height="56" rx="10" fill="#f0fdfa" stroke="#0d9488" stroke-width="1.6" filter="url(#sh)"/><text x="300.0" y="40.5" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Roboto, sans-serif" font-size="13" font-weight="650" fill="#134e4a" text-anchor="middle">execute_arm_translate</text><text x="300.0" y="59.5" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Roboto, sans-serif" font-size="12" font-weight="400" fill="#134e4a" text-anchor="middle">core 0</text><path d="M300,78 L300,580" stroke="#0d9488" stroke-width="1.5" stroke-dasharray="4 5" opacity="0.6"/><rect x="415" y="20" width="170" height="56" rx="10" fill="#fff7ed" stroke="#ea580c" stroke-width="1.6" filter="url(#sh)"/><text x="500.0" y="40.5" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Roboto, sans-serif" font-size="13" font-weight="650" fill="#7c2d12" text-anchor="middle">translated block</text><text x="500.0" y="59.5" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Roboto, sans-serif" font-size="12" font-weight="400" fill="#7c2d12" text-anchor="middle">PSRAM</text><path d="M500,78 L500,580" stroke="#ea580c" stroke-width="1.5" stroke-dasharray="4 5" opacity="0.6"/><rect x="615" y="20" width="170" height="56" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.6" filter="url(#sh)"/><text x="700.0" y="40.5" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Roboto, sans-serif" font-size="13" font-weight="650" fill="#14532d" text-anchor="middle">C helper</text><text x="700.0" y="59.5" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Roboto, sans-serif" font-size="12" font-weight="400" fill="#14532d" text-anchor="middle">IRAM</text><path d="M700,78 L700,580" stroke="#16a34a" stroke-width="1.5" stroke-dasharray="4 5" opacity="0.6"/><rect x="805" y="20" width="170" height="56" rx="10" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.6" filter="url(#sh)"/><text x="890.0" y="40.5" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Roboto, sans-serif" font-size="13" font-weight="650" fill="#4c1d95" text-anchor="middle">renderer</text><text x="890.0" y="59.5" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Roboto, sans-serif" font-size="12" font-weight="400" fill="#4c1d95" text-anchor="middle">core 1</text><path d="M890,78 L890,580" stroke="#7c3aed" stroke-width="1.5" stroke-dasharray="4 5" opacity="0.6"/><path d="M114,118 L294,118" fill="none" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#ah)"/><text x="205.0" y="111" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Roboto, sans-serif" font-size="12" font-weight="400" fill="#0f172a" text-anchor="middle">run one frame of cycles</text><path d="M304,160 L494,160" fill="none" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#ah)"/><text x="400.0" y="153" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Roboto, sans-serif" font-size="12" font-weight="400" fill="#0f172a" text-anchor="middle">xt_enter, first block</text><rect x="420" y="186" width="370" height="170" rx="10" fill="#fff7ed" fill-opacity="0.6" stroke="#ea580c" stroke-dasharray="5 4"/><text x="432" y="204" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Roboto, sans-serif" font-size="11.5" font-weight="600" fill="#c2410c" text-anchor="start">loop until the cycle budget runs out</text><text x="500" y="228" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Roboto, sans-serif" font-size="12" font-weight="400" fill="#0f172a" text-anchor="middle">ALU ops on reg[]</text><path d="M504,262 L694,262" fill="none" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#ah)"/><text x="600.0" y="255" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Roboto, sans-serif" font-size="12" font-weight="400" fill="#0f172a" text-anchor="middle">memory access (callx8)</text><path d="M696,292 L506,292" fill="none" stroke="#94a3b8" stroke-width="1.8" stroke-dasharray="6 5" marker-end="url(#ah)"/><text x="600.0" y="285" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Roboto, sans-serif" font-size="12" font-weight="400" fill="#0f172a" text-anchor="middle">value, or redirect (IRQ, SMC)</text><text x="500" y="330" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Roboto, sans-serif" font-size="12" font-weight="400" fill="#0f172a" text-anchor="middle">branch: direct jump to the next block</text><path d="M504,392 L694,392" fill="none" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#ah)"/><text x="600.0" y="385" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Roboto, sans-serif" font-size="12" font-weight="400" fill="#0f172a" text-anchor="middle">xt_update_gba (cycles used up)</text><path d="M704,428 L884,428" fill="none" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#ah)"/><text x="795.0" y="421" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Roboto, sans-serif" font-size="12" font-weight="400" fill="#0f172a" text-anchor="middle">scanline ready (queue + notify)</text><path d="M696,466 L306,466" fill="none" stroke="#94a3b8" stroke-width="1.8" stroke-dasharray="6 5" marker-end="url(#ah)"/><text x="500.0" y="459" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Roboto, sans-serif" font-size="12" font-weight="400" fill="#0f172a" text-anchor="middle">frame done: retw</text><path d="M296,500 L116,500" fill="none" stroke="#94a3b8" stroke-width="1.8" stroke-dasharray="6 5" marker-end="url(#ah)"/><text x="205.0" y="493" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Roboto, sans-serif" font-size="12" font-weight="400" fill="#0f172a" text-anchor="middle">return</text><path d="M114,536 L884,536" fill="none" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#ah)"/><text x="500.0" y="529" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Roboto, sans-serif" font-size="12" font-weight="400" fill="#0f172a" text-anchor="middle">wait for the last lines, then display + audio</text></svg>
