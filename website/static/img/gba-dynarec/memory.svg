"500" y="369.0" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Roboto, sans-serif" font-size="11.5" font-weight="400" fill="#475569" text-anchor="middle">translated code</text><text x="500" y="384.0" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Roboto, sans-serif" font-size="11.5" font-weight="400" fill="#475569" text-anchor="middle">(a miss costs ~11x)</text><path d="M830,230 L830,474 L624,474" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#ah)"/><rect x="791.0" y="383.5" width="78.0" height="21" rx="6" fill="#ffffff" fill-opacity="0.95"/><text x="830" y="399.5" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Roboto, sans-serif" font-size="11.5" font-weight="400" fill="#475569" text-anchor="middle">flash code</text></svg>
