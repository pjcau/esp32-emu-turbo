t><text x="500.0" y="104.0" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Roboto, sans-serif" font-size="12" font-weight="400" fill="#7c2d12" text-anchor="middle">EWRAM · VRAM · ROM pages</text><rect x="366" y="138" width="268" height="56" rx="10" fill="#fff7ed" stroke="#ea580c" stroke-width="1.6" filter="url(#sh)"/><text x="500.0" y="159.0" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Roboto, sans-serif" font-size="14" font-weight="650" fill="#7c2d12" text-anchor="middle">core-1 data</text><text x="500.0" y="179.0" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Roboto, sans-serif" font-size="12" font-weight="400" fill="#7c2d12" text-anchor="middle">renderer VRAM copy · OBJ lists</text><rect x="366" y="206" width="268" height="120" rx="10" fill="#fff7ed" stroke="#ea580c" stroke-width="1.6" filter="url(#sh)"/><text x="500.0" y="241.0" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Roboto, sans-serif" font-size="14" font-weight="650" fill="#7c2d12" text-anchor="middle">translation caches</text><text x="500.0" y="261.0" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Roboto, sans-serif" font-size="12" font-weight="400" fill="#7c2d12" text-anchor="middle">ROM 2 MB + RAM 384 KB</text><text x="500.0" y="279.0" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Roboto, sans-serif" font-size="12" font-weight="400" fill="#7c2d12" text-anchor="middle">mapped twice: data + exec</text><text x="500.0" y="297.0" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Roboto, sans-serif" font-size="12" font-weight="400" fill="#7c2d12" text-anchor="middle">Metal Slug: ~900 KB of code</text><rect x="680" y="20" width="300" height="400" rx="14" fill="#f8fafc" fill-opacity="0.55" stroke="#64748b" stroke-width="1.4" stroke-dasharray="2 0"/><text x="694" y="42" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Roboto, sans-serif" font-size="13" font-weight="700" fill="#64748b" text-anchor="start">flash · XIP</text