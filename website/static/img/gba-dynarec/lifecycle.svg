<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 450" width="1000" height="450" role="img" aria-label="Life of a block"><title>Life of a block</title><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker><filter id="sh" x="-5%" y="-5%" width="110%" height="120%"><feDropShadow dx="0" dy="1.5" stdDeviation="1.6" flood-color="#0f172a" flood-opacity="0.12"/></filter></defs><rect x="0" y="0" width="1000" height="450" rx="16" fill="#ffffff"/><rect x="40" y="190" width="170" height="70" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6" filter="url(#sh)"/><text x="125.0" y="218.0" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Roboto, sans-serif" font-size="14" font-weight="650" fill="#1e3a8a" text-anchor="middle">lookup PC</text><text x="125.0" y="238.0" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Roboto, sans-serif" font-size="12" font-weight="400" fill="#1e3a8a" text-anchor="middle">hash table (ROM / RAM)</text><rect x="330" y="40" width="200" height="70" rx="10" fill="#fff7ed" stroke="#ea580c" stroke-width="1.6" filter="url(#sh)"/><text x="430.0" y="59.0" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Roboto, sans-serif" font-size="14" font-weight="650" fill="#7c2d12" text-anchor="middle">translate</text><text x="430.0" y="79.0" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Roboto, sans-serif" font-size="12" font-weight="400" fill="#7c2d12" text-anchor="middle">decode once, emit Xtensa</text><text x="430.0" y="97.0" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Roboto, sans-serif" font-size="12" font-weight="400" fill="#7c2d12" text-anchor="middle">sync the cache</text><rect x="330" y="190" width="200" height="70" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.6" filter="url(#sh)"/><text x="430.0" y="218.0" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Roboto, sans-serif" font-size="14" font-weight="650" fill="#14532d" text-anchor="middle">run</text><text x="430.0" y="238.0" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Roboto, sans-serif" font-size="12" font-weight="400" fill="#14532d" text-anchor="middle">native code, cycles in a3</text><rect x="700" y="60" width="240" height="70" rx="10" fill="#f0fdfa" stroke="#0d9488" stroke-width="1.6" filter="url(#sh)"/><text x="820.0" y="88.0" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Roboto, sans-serif" font-size="14" font-weight="650" fill="#134e4a" text-anchor="middle">linked</text><text x="820.0" y="108.0" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Roboto, sans-serif" font-size="12" font-weight="400" fill="#134e4a" text-anchor="middle">exit patched into a direct j</text><rect x="700" y="300" width="240" height="70" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="1.6" filter="url(#sh)"/><text x="820.0" y="319.0" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Roboto, sans-serif" font-size="14" font-weight="650" fill="#7f1d1d" text-anchor="middle">flushed</text><text x="820.0" y="339.0" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Roboto, sans-serif" font-size="12" font-weight="400" fill="#7f1d1d" text-anchor="middle">cache full, or the game</text><text x="820.0" y="357.0" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Roboto, sans-serif" font-size="12" font-weight="400" fill="#7f1d1d" text-anchor="middle">overwrote code in RAM</text><rect x="330" y="330" width="200" height="60" rx="10" fill="#f8fafc" stroke="#64748b" stroke-width="1.6" filter="url(#sh)"/><text x="430.0" y="352.5" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Roboto, sans-serif" font-size="13" font-weight="650" fill="#1e293b" text-anchor="middle">update_gba</text><text x="430.0" y="371.5" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Roboto, sans-serif" font-size="12" font-weight="400" fill="#1e293b" text-anchor="middle">timers · DMA · IRQ · frame end</text><path d="M210,205 L328,92" fill="none" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#ah)"/><rect x="242.8" y="128.5" width="38.4" height="21" rx="6" fill="#ffffff" fill-opacity="0.95"/><text x="262" y="144.5" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Roboto, sans-serif" font-size="11.5" font-weight="400" fill="#475569" text-anchor="middle">miss</text><path d="M430,112 L430,188" fill="none" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#ah)"/><rect x="410.8" y="138.5" width="38.4" height="21" rx="6" fill="#ffffff" fill-opacity="0.95"/><text x="430" y="154.5" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Roboto, sans-serif" font-size="11.5" font-weight="400" fill="#475569" text-anchor="middle">done</text><path d="M210,222 L328,222" fill="none" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#ah)"/><rect x="252.1" y="210.5" width="31.799999999999997" height="21" rx="6" fill="#ffffff" fill-opacity="0.95"/><text x="268" y="226.5" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Roboto, sans-serif" font-size="11.5" font-weight="400" fill="#475569" text-anchor="middle">hit</text><path d="M530,205 L698,112" fill="none" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#ah)"/><rect x="556.5" y="138.5" width="111.0" height="21" rx="6" fill="#ffffff" fill-opacity="0.95"/><text x="612" y="154.5" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Roboto, sans-serif" font-size="11.5" font-weight="400" fill="#475569" text-anchor="middle">exit taken once</text><path d="M760,132 L760,234 L532,234" fill="none" stroke="#94a3b8" stroke-width="1.8" stroke-dasharray="6 5" marker-end="url(#ah)"/><rect x="545.1" y="222.5" width="229.79999999999998" height="21" rx="6" fill="#ffffff" fill-opacity="0.95"/><text x="660" y="238.5" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Roboto, sans-serif" font-size="11.5" font-weight="400" fill="#475569" text-anchor="middle">next time: direct jump, no lookup</text><path d="M328,250 L212,250" fill="none" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#ah)"/><text x="270" y="276" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Roboto, sans-serif" font-size="11.5" font-weight="400" fill="#475569" text-anchor="middle">indirect branch</text><text x="270" y="291" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Roboto, sans-serif" font-size="11.5" font-weight="400" fill="#475569" text-anchor="middle">(bx, pop pc, IRQ)</text><path d="M430,262 L430,328" fill="none" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#ah)"/><rect x="377.8" y="284.5" width="104.39999999999999" height="21" rx="6" fill="#ffffff" fill-opacity="0.95"/><text x="430" y="300.5" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Roboto, sans-serif" font-size="11.5" font-weight="400" fill="#475569" text-anchor="middle">cycles run out</text><path d="M328,360 L125,360 L125,262" fill="none" stroke="#94a3b8" stroke-width="1.8" stroke-dasharray="6 5" marker-end="url(#ah)"/><rect x="187.0" y="348.5" width="78.0" height="21" rx="6" fill="#ffffff" fill-opacity="0.95"/><text x="226" y="364.5" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Roboto, sans-serif" font-size="11.5" font-weight="400" fill="#475569" text-anchor="middle">next slice</text><path d="M530,256 L698,330" fill="none" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#ah)"/><rect x="551.2" y="288.5" width="117.6" height="21" rx="6" fill="#ffffff" fill-opacity="0.95"/><text x="610" y="304.5" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Roboto, sans-serif" font-size="11.5" font-weight="400" fill="#475569" text-anchor="middle">SMC / cache full</text><path d="M820,372 L820,425 L70,425 L70,262" fill="none" stroke="#94a3b8" stroke-width="1.8" stroke-dasharray="6 5" marker-end="url(#ah)"/><rect x="330.1" y="413.5" width="229.79999999999998" height="21" rx="6" fill="#ffffff" fill-opacity="0.95"/><text x="445" y="429.5" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Roboto, sans-serif" font-size="11.5" font-weight="400" fill="#475569" text-anchor="middle">everything retranslated on demand</text></svg>
