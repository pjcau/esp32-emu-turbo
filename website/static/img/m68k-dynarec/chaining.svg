<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 330" width="1000" height="330" role="img" aria-label="Block chaining"><title>Block chaining</title><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker><filter id="sh" x="-5%" y="-5%" width="110%" height="120%"><feDropShadow dx="0" dy="1.5" stdDeviation="1.6" flood-color="#0f172a" flood-opacity="0.12"/></filter></defs><rect x="0" y="0" width="1000" height="330" rx="16" fill="#ffffff"/><rect x="30" y="110" width="200" height="80" rx="10" fill="#fff7ed" stroke="#ea580c" stroke-width="1.6" filter="url(#sh)"/><text x="130.0" y="134.5" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Roboto, sans-serif" font-size="14" font-weight="650" fill="#7c2d12" text-anchor="middle">block A</text><text x="130.0" y="154.5" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Roboto, sans-serif" font-size="11.5" font-weight="400" fill="#7c2d12" text-anchor="middle">exit to a known target</text><text x="130.0" y="172.0" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Roboto, sans-serif" font-size="11.5" font-weight="400" fill="#7c2d12" text-anchor="middle">(Bcc/DBcc, BRA/BSR, fall-through)</text><rect x="330" y="40" width="220" height="70" rx="10" fill="#f8fafc" stroke="#64748b" stroke-width="1.6" filter="url(#sh)"/><text x="440.0" y="59.5" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Roboto, sans-serif" font-size="14" font-weight="650" fill="#1e293b" text-anchor="middle">slot, first time</text><text x="440.0" y="79.5" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Roboto, sans-serif" font-size="11.5" font-weight="400" fill="#1e293b" text-anchor="middle">stub: back to the dispatcher,</text><text x="440.0" y="97.0" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Roboto, sans-serif" font-size="11.5" font-weight="400" fill="#1e293b" text-anchor="middle">remember the slot</text><rect x="330" y="190" width="220" height="70" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.6" filter="url(#sh)"/><text x="440.0" y="218.0" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Roboto, sans-serif" font-size="14" font-weight="650" fill="#14532d" text-anchor="middle">slot, afterwards</text><text x="440.0" y="238.0" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Roboto, sans-serif" font-size="12" font-weight="400" fill="#14532d" text-anchor="middle">block B&#x27;s chain entry</text><rect x="700" y="40" width="260" height="70" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6" filter="url(#sh)"/><text x="830.0" y="59.5" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Roboto, sans-serif" font-size="14" font-weight="650" fill="#1e3a8a" text-anchor="middle">dispatcher</text><text x="830.0" y="79.5" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Roboto, sans-serif" font-size="11.5" font-weight="400" fill="#1e3a8a" text-anchor="middle">finds or translates block B</text><text x="830.0" y="97.0" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Roboto, sans-serif" font-size="11.5" font-weight="400" fill="#1e3a8a" text-anchor="middle">writes B into the slot</text><rect x="700" y="190" width="260" height="70" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.6" filter="url(#sh)"/><text x="830.0" y="218.0" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Roboto, sans-serif" font-size="14" font-weight="650" fill="#14532d" text-anchor="middle">block B</text><text x="830.0" y="238.0" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Roboto, sans-serif" font-size="12" font-weight="400" fill="#14532d" text-anchor="middle">runs with no return to C</text><path d="M232,135 L328,80" fill="none" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#ah)"/><rect x="237.6" y="86.5" width="64.8" height="21" rx="6" fill="#ffffff" fill-opacity="0.95"/><text x="270" y="102.5" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Roboto, sans-serif" font-size="11.5" font-weight="400" fill="#475569" text-anchor="middle">1st time</text><path d="M552,75 L698,75" fill="none" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#ah)"/><path d="M830,112 L830,150 L440,150 L440,188" fill="none" stroke="#94a3b8" stroke-width="1.8" stroke-dasharray="6 5" marker-end="url(#ah)"/><rect x="617.5" y="138.5" width="45.0" height="21" rx="6" fill="#ffffff" fill-opacity="0.95"/><text x="640" y="154.5" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Roboto, sans-serif" font-size="11.5" font-weight="400" fill="#475569" text-anchor="middle">patch</text><path d="M232,165 L328,225" fill="none" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#ah)"/><rect x="231.0" y="192.5" width="78.0" height="21" rx="6" fill="#ffffff" fill-opacity="0.95"/><text x="270" y="208.5" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Roboto, sans-serif" font-size="11.5" font-weight="400" fill="#475569" text-anchor="middle">next times</text><path d="M552,225 L698,225" fill="none" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#ah)"/><rect x="562.9" y="195.5" width="124.19999999999999" height="21" rx="6" fill="#ffffff" fill-opacity="0.95"/><text x="625" y="211.5" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Roboto, sans-serif" font-size="11.5" font-weight="400" fill="#475569" text-anchor="middle">cycle check first</text><text x="500" y="300" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Roboto, sans-serif" font-size="12" font-weight="400" fill="#475569" text-anchor="middle">loops (DBcc, Bcc back) chain to themselves; on random code a third of the returns to the dispatcher disappear</text></svg>
