<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 350" width="1000" height="350" role="img" aria-label="Musashi interpreter vs m68kjit"><title>Musashi interpreter vs m68kjit</title><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker><filter id="sh" x="-5%" y="-5%" width="110%" height="120%"><feDropShadow dx="0" dy="1.5" stdDeviation="1.6" flood-color="#0f172a" flood-opacity="0.12"/></filter></defs><rect x="0" y="0" width="1000" height="350" rx="16" fill="#ffffff"/><rect x="20" y="20" width="470" height="310" rx="14" fill="#f8fafc" fill-opacity="0.55" stroke="#64748b" stroke-width="1.4" stroke-dasharray="2 0"/><text x="34" y="42" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Roboto, sans-serif" font-size="13" font-weight="700" fill="#64748b" text-anchor="start">Musashi interpreter  ·  m68k_execute()</text><text x="255" y="60" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Roboto, sans-serif" font-size="12" font-weight="400" fill="#475569" text-anchor="middle">fetch + decode + dispatch on EVERY instruction</text><rect x="60" y="90" width="170" height="64" rx="10" fill="#f8fafc" stroke="#64748b" stroke-width="1.6" filter="url(#sh)"/><text x="145.0" y="115.0" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Roboto, sans-serif" font-size="14" font-weight="650" fill="#1e293b" text-anchor="middle">fetch</text><text x="145.0" y="135.0" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Roboto, sans-serif" font-size="12" font-weight="400" fill="#1e293b" text-anchor="middle">opcode word at PC</text><rect x="280" y="90" width="170" height="64" rx="10" fill="#f8fafc" stroke="#64748b" stroke-width="1.6" filter="url(#sh)"/><text x="365.0" y="115.0" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Roboto, sans-serif" font-size="14" font-weight="650" fill="#1e293b" text-anchor="middle">dispatch</text><text x="365.0" y="135.0" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Roboto, sans-serif" font-size="12" font-weight="400" fill="#1e293b" text-anchor="middle">handler table[op]</text><rect x="170" y="220" width="170" height="64" rx="10" fill="#f8fafc" stroke="#64748b" stroke-width="1.6" filter="url(#sh)"/><text x="255.0" y="245.0" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Roboto, sans-serif" font-size="14" font-weight="650" fill="#1e293b" text-anchor="middle">handler</text><text x="255.0" y="265.0" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Roboto, sans-serif" font-size="12" font-weight="400" fill="#1e293b" text-anchor="middle">C code per opcode</text><path d="M230,122 L278,122" fill="none" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#ah)"/><path d="M365,156 L300,218" fill="none" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#ah)"/><path d="M200,218 L140,158" fill="none" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#ah)"/><rect x="510" y="20" width="470" height="310" rx="14" fill="#f0fdf4" fill-opacity="0.55" stroke="#16a34a" stroke-width="1.4" stroke-dasharray="2 0"/><text x="524" y="42" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Roboto, sans-serif" font-size="13" font-weight="700" fill="#16a34a" text-anchor="start">m68kjit  ·  on top of the same Musashi</text><text x="745" y="60" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Roboto, sans-serif" font-size="12" font-weight="400" fill="#475569" text-anchor="middle">fetch and decode ONCE per block, then Xtensa code</text><rect x="540" y="86" width="410" height="60" rx="10" fill="#fff7ed" stroke="#ea580c" stroke-width="1.6" filter="url(#sh)"/><text x="745.0" y="109.0" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Roboto, sans-serif" font-size="14" font-weight="650" fill="#7c2d12" text-anchor="middle">first time a block is reached</text><text x="745.0" y="129.0" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Roboto, sans-serif" font-size="12" font-weight="400" fill="#7c2d12" text-anchor="middle">length-decode it, emit Xtensa code into the cache</text><rect x="540" y="176" width="195" height="70" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.6" filter="url(#sh)"/><text x="637.5" y="194.75" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Roboto, sans-serif" font-size="13.5" font-weight="650" fill="#14532d" text-anchor="middle">native</text><text x="637.5" y="214.25" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Roboto, sans-serif" font-size="12" font-weight="400" fill="#14532d" text-anchor="middle">known forms: Xtensa code</text><text x="637.5" y="232.25" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Roboto, sans-serif" font-size="12" font-weight="400" fill="#14532d" text-anchor="middle">on Musashi&#x27;s registers</text><rect x="755" y="176" width="195" height="70" rx="10" fill="#f0fdfa" stroke="#0d9488" stroke-width="1.6" filter="url(#sh)"/><text x="852.5" y="194.75" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Roboto, sans-serif" font-size="13.5" font-weight="650" fill="#134e4a" text-anchor="middle">handler call</text><text x="852.5" y="214.25" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Roboto, sans-serif" font-size="12" font-weight="400" fill="#134e4a" text-anchor="middle">anything else: Musashi&#x27;s</text><text x="852.5" y="232.25" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Roboto, sans-serif" font-size="12" font-weight="400" fill="#134e4a" text-anchor="middle">own handler, exact</text><path d="M700,148 L640,174" fill="none" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#ah)"/><path d="M790,148 L850,174" fill="none" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#ah)"/><text x="745" y="280" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Roboto, sans-serif" font-size="12.5" font-weight="650" fill="#16a34a" text-anchor="middle">84 % of random valid 68000 code runs native</text><text x="745" y="302" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Roboto, sans-serif" font-size="12" font-weight="400" fill="#475569" text-anchor="middle">every instruction works from day one: the rest is the interpreter</text></svg>
