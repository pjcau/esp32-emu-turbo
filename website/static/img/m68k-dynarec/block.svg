<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" width="1000" height="470" role="img" aria-label="Inside a block"><title>Inside a block</title><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker><filter id="sh" x="-5%" y="-5%" width="110%" height="120%"><feDropShadow dx="0" dy="1.5" stdDeviation="1.6" flood-color="#0f172a" flood-opacity="0.12"/></filter></defs><rect x="0" y="0" width="1000" height="470" rx="16" fill="#ffffff"/><text x="24" y="34" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Roboto, sans-serif" font-size="14" font-weight="700" fill="#0f172a" text-anchor="start">a block: up to 64 instructions from one PC, fixed code (ROM) only</text><text x="24" y="54" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Roboto, sans-serif" font-size="12" font-weight="400" fill="#475569" text-anchor="start">code in RAM stays interpreted, so no write can make a block stale</text><rect x="24" y="80" width="230" height="52" rx="10" fill="#f8fafc" stroke="#64748b" stroke-width="1.6" filter="url(#sh)"/><text x="139" y="111" font-family="'JetBrains Mono', 'Fira Code', Menlo, Consolas, monospace" font-size="13" font-weight="600" fill="#0f172a" text-anchor="middle" xml:space="preserve">MOVE.w (A0)+,D1</text><path d="M254,106 L282,106" fill="none" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#ah)"/><rect x="284" y="80" width="160" height="52" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.6" filter="url(#sh)"/><text x="364" y="111" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Roboto, sans-serif" font-size="13" font-weight="650" fill="#14532d" text-anchor="middle">native</text><rect x="24" y="150" width="230" height="52" rx="10" fill="#f8fafc" stroke="#64748b" stroke-width="1.6" filter="url(#sh)"/><text x="139" y="181" font-family="'JetBrains Mono', 'Fira Code', Menlo, Consolas, monospace" font-size="13" font-weight="600" fill="#0f172a" text-anchor="middle" xml:space="preserve">MULU D2,D1</text><path d="M254,176 L282,176" fill="none" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#ah)"/><rect x="284" y="150" width="160" height="52" rx="10" fill="#f0fdfa" stroke="#0d9488" stroke-width="1.6" filter="url(#sh)"/><text x="364" y="181" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Roboto, sans-serif" font-size="13" font-weight="650" fill="#134e4a" text-anchor="middle">handler call</text><rect x="24" y="220" width="230" height="52" rx="10" fill="#f8fafc" stroke="#64748b" stroke-width="1.6" filter="url(#sh)"/><text x="139" y="251" font-family="'JetBrains Mono', 'Fira Code', Menlo, Consolas, monospace" font-size="13" font-weight="600" fill="#0f172a" text-anchor="middle" xml:space="preserve">DBF D3,loop</text><path d="M254,246 L282,246" fill="none" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#ah)"/><rect x="284" y="220" width="160" height="52" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.6" filter="url(#sh)"/><text x="364" y="251" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Roboto, sans-serif" font-size="13" font-weight="650" fill="#14532d" text-anchor="middle">native</text><rect x="480" y="80" width="496" height="106" rx="10" fill="#0f172a" filter="url(#sh)"/><text x="494" y="102" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Roboto, sans-serif" font-size="11.5" font-weight="600" fill="#94a3b8" text-anchor="start">per instruction, what the interpreter loop does</text><text x="494" y="120" font-family="'JetBrains Mono', 'Fira Code', Menlo, Consolas, monospace" font-size="12.5" font-weight="400" fill="#e2e8f0" text-anchor="start" xml:space="preserve">PPC = pc, PC = pc + 2, IR = op</text><text x="494" y="138" font-family="'JetBrains Mono', 'Fira Code', Menlo, Consolas, monospace" font-size="12.5" font-weight="400" fill="#e2e8f0" text-anchor="start" xml:space="preserve">handler()</text><text x="676.4" y="138" font-family="'JetBrains Mono', 'Fira Code', Menlo, Consolas, monospace" font-size="12.5" font-weight="400" fill="#7dd3fc" text-anchor="start" xml:space="preserve">; or native Xtensa</text><text x="494" y="156" font-family="'JetBrains Mono', 'Fira Code', Menlo, Consolas, monospace" font-size="12.5" font-weight="400" fill="#e2e8f0" text-anchor="start" xml:space="preserve">cycles -= cyc[op]</text><text x="494" y="174" font-family="'JetBrains Mono', 'Fira Code', Menlo, Consolas, monospace" font-size="12.5" font-weight="400" fill="#e2e8f0" text-anchor="start" xml:space="preserve">if (PC != next || cycles &lt;= 0) leave</text><text x="728" y="222" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Roboto, sans-serif" font-size="11.5" font-weight="400" fill="#475569" text-anchor="middle">native register-only forms skip the PPC/IR stores and the call</text><rect x="24" y="300" width="952" height="150" rx="14" fill="#fef2f2" fill-opacity="0.55" stroke="#dc2626" stroke-width="1.4" stroke-dasharray="2 0"/><text x="38" y="322" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Roboto, sans-serif" font-size="13" font-weight="700" fill="#dc2626" text-anchor="start">a block leaves exactly where m68k_execute() would stop</text><rect x="44" y="340" width="212" height="64" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="1.6" filter="url(#sh)"/><text x="150.0" y="364.75" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Roboto, sans-serif" font-size="13.5" font-weight="650" fill="#7f1d1d" text-anchor="middle">taken branch</text><text x="150.0" y="384.25" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Roboto, sans-serif" font-size="12" font-weight="400" fill="#7f1d1d" text-anchor="middle">PC != next</text><rect x="272" y="340" width="212" height="64" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="1.6" filter="url(#sh)"/><text x="378.0" y="364.75" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Roboto, sans-serif" font-size="13.5" font-weight="650" fill="#7f1d1d" text-anchor="middle">exception / TRAP</text><text x="378.0" y="384.25" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Roboto, sans-serif" font-size="12" font-weight="400" fill="#7f1d1d" text-anchor="middle">handler moved PC</text><rect x="500" y="340" width="212" height="64" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="1.6" filter="url(#sh)"/><text x="606.0" y="364.75" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Roboto, sans-serif" font-size="13.5" font-weight="650" fill="#7f1d1d" text-anchor="middle">interrupt</text><text x="606.0" y="384.25" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Roboto, sans-serif" font-size="12" font-weight="400" fill="#7f1d1d" text-anchor="middle">taken inside a memory handler</text><rect x="728" y="340" width="212" height="64" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="1.6" filter="url(#sh)"/><text x="834.0" y="364.75" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Roboto, sans-serif" font-size="13.5" font-weight="650" fill="#7f1d1d" text-anchor="middle">end of slice</text><text x="834.0" y="384.25" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Roboto, sans-serif" font-size="12" font-weight="400" fill="#7f1d1d" text-anchor="middle">cycles &lt;= 0</text><text x="500" y="432" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Roboto, sans-serif" font-size="12" font-weight="400" fill="#475569" text-anchor="middle">the instruction always finishes first: registers, flags and cycles equal the interpreter&#x27;s</text></svg>
