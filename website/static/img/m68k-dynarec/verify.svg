<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 290" width="1000" height="290" role="img" aria-label="How the 68000 dynarec is verified"><title>How the 68000 dynarec is verified</title><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker><filter id="sh" x="-5%" y="-5%" width="110%" height="120%"><feDropShadow dx="0" dy="1.5" stdDeviation="1.6" flood-color="#0f172a" flood-opacity="0.12"/></filter></defs><rect x="0" y="0" width="1000" height="290" rx="16" fill="#ffffff"/><rect x="24" y="70" width="220" height="100" rx="10" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.6" filter="url(#sh)"/><text x="134.0" y="104.0" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Roboto, sans-serif" font-size="14" font-weight="650" fill="#4c1d95" text-anchor="middle">lengths</text><text x="134.0" y="124.0" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Roboto, sans-serif" font-size="12" font-weight="400" fill="#4c1d95" text-anchor="middle">m68kjit_insn_len vs the</text><text x="134.0" y="142.0" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Roboto, sans-serif" font-size="12" font-weight="400" fill="#4c1d95" text-anchor="middle">disassembler, 45799 opcodes</text><rect x="32" y="60" width="25.6" height="20" rx="10" fill="#7c3aed"/><text x="44.8" y="74" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Roboto, sans-serif" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">PC</text><path d="M244,120 L268,120" fill="none" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#ah)"/><rect x="268" y="70" width="220" height="100" rx="10" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.6" filter="url(#sh)"/><text x="378.0" y="104.0" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Roboto, sans-serif" font-size="14" font-weight="650" fill="#4c1d95" text-anchor="middle">block model</text><text x="378.0" y="124.0" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Roboto, sans-serif" font-size="12" font-weight="400" fill="#4c1d95" text-anchor="middle">C blocks vs m68k_execute()</text><text x="378.0" y="142.0" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Roboto, sans-serif" font-size="12" font-weight="400" fill="#4c1d95" text-anchor="middle">random machines, 4 mutations</text><rect x="276" y="60" width="25.6" height="20" rx="10" fill="#7c3aed"/><text x="288.8" y="74" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Roboto, sans-serif" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">PC</text><path d="M488,120 L512,120" fill="none" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#ah)"/><rect x="512" y="70" width="220" height="100" rx="10" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.6" filter="url(#sh)"/><text x="622.0" y="104.0" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Roboto, sans-serif" font-size="14" font-weight="650" fill="#4c1d95" text-anchor="middle">QEMU fuzz</text><text x="622.0" y="124.0" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Roboto, sans-serif" font-size="12" font-weight="400" fill="#4c1d95" text-anchor="middle">Xtensa blocks vs Musashi</text><text x="622.0" y="142.0" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Roboto, sans-serif" font-size="12" font-weight="400" fill="#4c1d95" text-anchor="middle">600 seeds + 23 families</text><rect x="520" y="60" width="39.2" height="20" rx="10" fill="#7c3aed"/><text x="539.6" y="74" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Roboto, sans-serif" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">QEMU</text><path d="M732,120 L756,120" fill="none" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#ah)"/><rect x="756" y="70" width="220" height="100" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6" filter="url(#sh)"/><text x="866.0" y="104.0" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Roboto, sans-serif" font-size="14" font-weight="650" fill="#1e3a8a" text-anchor="middle">board</text><text x="866.0" y="124.0" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Roboto, sans-serif" font-size="12" font-weight="400" fill="#1e3a8a" text-anchor="middle">speed guard vs interpreter</text><text x="866.0" y="142.0" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Roboto, sans-serif" font-size="12" font-weight="400" fill="#1e3a8a" text-anchor="middle">games + webcam (step 9)</text><rect x="764" y="60" width="46.0" height="20" rx="10" fill="#2563eb"/><text x="787.0" y="74" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Roboto, sans-serif" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">board</text><text x="500" y="36" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Roboto, sans-serif" font-size="13" font-weight="600" fill="#475569" text-anchor="middle">a change moves right only if the step before it passes</text><rect x="24" y="196" width="952" height="76" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="1.6" filter="url(#sh)"/><text x="500.0" y="217.75" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Roboto, sans-serif" font-size="13.5" font-weight="650" fill="#7f1d1d" text-anchor="middle">every native group was broken on purpose once, and the fuzz caught it</text><text x="500.0" y="237.25" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Roboto, sans-serif" font-size="12" font-weight="400" fill="#7f1d1d" text-anchor="middle">wrong V on ADD · not-taken cycles · A7 byte step · index sign extension · chain cycle check · ASL&#x27;s V</text><text x="500.0" y="255.25" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Roboto, sans-serif" font-size="12" font-weight="400" fill="#7f1d1d" text-anchor="middle">and it found one real bug: the PC store clobbered a memory-to-memory MOVE</text></svg>
