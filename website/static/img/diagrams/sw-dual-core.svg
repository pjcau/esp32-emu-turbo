oe UI', system-ui, -apple-system, Roboto, sans-serif" font-size="12.5" font-weight="600" fill="#1e3a8a" text-anchor="middle">Input polling</text><rect x="510" y="20" width="470" height="190" rx="14" fill="#f5f3ff" fill-opacity="0.55" stroke="#7c3aed" stroke-width="1.4" stroke-dasharray="2 0"/><text x="524" y="42" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Roboto, sans-serif" font-size="13" font-weight="700" fill="#7c3aed" text-anchor="start">Core 1 (audio)</text><rect x="530" y="56" width="430" height="30" rx="8" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.6"/><text x="745" y="76" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Roboto, sans-serif" font-size="12.5" font-weight="600" fill="#4c1d95" text-anchor="middle">SPC700 CPU emulation</text><rect x="530" y="92" width="430" height="30" rx="8" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.6"/><text x="745" y="112" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Roboto, sans-serif" font-size="12.5" font-weight="600" fill="#4c1d95" text-anchor="middle">DSP (assembly from Phase 4.1)</text><rect x="530" y="128" width="430" height="30" rx="8" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.6"/><text x="745" y="148" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Roboto, sans-serif" font-size="12.5" font-weight="600" fill="#4c1d95" text-anchor="middle">I2S DMA output feed</text><text x="40" y="240" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Roboto, sans-serif" font-size="12" font-weight="700" fill="#475569" text-anchor="start">ms per frame</text><text x="170" y="368" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Roboto, sans-serif" font-size="11.5" font-weight="400" fill="#475569" text-anchor="middle">0</text><text x="258" y="368" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Roboto, sans-serif" font-size="11.5" font-weight="400" fill="#475569" text-anchor="middle">2</text><text x="346" y="368" font-family="Inter, 'Segoe UI', system