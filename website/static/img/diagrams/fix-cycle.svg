<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 250" width="1000" height="250" role="img" aria-label="The fix cycle"><title>The fix cycle</title><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker><filter id="sh" x="-5%" y="-5%" width="110%" height="120%"><feDropShadow dx="0" dy="1.5" stdDeviation="1.6" flood-color="#0f172a" flood-opacity="0.12"/></filter></defs><rect x="0" y="0" width="1000" height="250" rx="16" fill="#ffffff"/><rect x="20" y="50" width="140" height="70" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6" filter="url(#sh)"/><text x="90.0" y="78.0" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Roboto, sans-serif" font-size="14" font-weight="650" fill="#1e3a8a" text-anchor="middle">/verify</text><text x="90.0" y="98.0" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Roboto, sans-serif" font-size="12" font-weight="400" fill="#1e3a8a" text-anchor="middle">find failures</text><path d="M160,85 L184,85" fill="none" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#ah)"/><rect x="186" y="50" width="140" height="70" rx="10" fill="#fff7ed" stroke="#ea580c" stroke-width="1.6" filter="url(#sh)"/><text x="256.0" y="78.0" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Roboto, sans-serif" font-size="14" font-weight="650" fill="#7c2d12" text-anchor="middle">/dfm-fix</text><text x="256.0" y="98.0" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Roboto, sans-serif" font-size="12" font-weight="400" fill="#7c2d12" text-anchor="middle">edit source</text><path d="M326,85 L350,85" fill="none" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#ah)"/><rect x="352" y="50" width="140" height="70" rx="10" fill="#f0fdfa" stroke="#0d9488" stroke-width="1.6" filter="url(#sh)"/><text x="422.0" y="78.0" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Roboto, sans-serif" font-size="14" font-weight="650" fill="#134e4a" text-anchor="middle">/generate</text><text x="422.0" y="98.0" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Roboto, sans-serif" font-size="12" font-weight="400" fill="#134e4a" text-anchor="middle">regen PCB</text><path d="M492,85 L516,85" fill="none" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#ah)"/><rect x="518" y="50" width="140" height="70" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6" filter="url(#sh)"/><text x="588.0" y="78.0" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Roboto, sans-serif" font-size="14" font-weight="650" fill="#1e3a8a" text-anchor="middle">/verify</text><text x="588.0" y="98.0" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Roboto, sans-serif" font-size="12" font-weight="400" fill="#1e3a8a" text-anchor="middle">confirm fix</text><path d="M658,85 L682,85" fill="none" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#ah)"/><rect x="638.6" y="26.5" width="64.8" height="21" rx="6" fill="#ffffff" fill-opacity="0.95"/><text x="671.0" y="42.5" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Roboto, sans-serif" font-size="11.5" font-weight="400" fill="#475569" text-anchor="middle">all pass</text><rect x="684" y="50" width="140" height="70" rx="10" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.6" filter="url(#sh)"/><text x="754.0" y="78.0" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Roboto, sans-serif" font-size="14" font-weight="650" fill="#4c1d95" text-anchor="middle">/dfm-test</text><text x="754.0" y="98.0" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Roboto, sans-serif" font-size="12" font-weight="400" fill="#4c1d95" text-anchor="middle">add guard</text><path d="M824,85 L848,85" fill="none" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#ah)"/><rect x="850" y="50" width="140" height="70" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.6" filter="url(#sh)"/><text x="920.0" y="90" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Roboto, sans-serif" font-size="14" font-weight="650" fill="#14532d" text-anchor="middle">/release-prep</text><path d="M588.0,122 L588.0,180 L256.0,180 L256.0,124" fill="none" stroke="#dc2626" stroke-width="1.8" stroke-dasharray="6 5" marker-end="url(#ah)"/><rect x="373.1" y="168.5" width="97.8" height="21" rx="6" fill="#ffffff" fill-opacity="0.95"/><text x="422.0" y="184.5" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Roboto, sans-serif" font-size="11.5" font-weight="400" fill="#475569" text-anchor="middle">still failing</text><text x="500" y="225" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Roboto, sans-serif" font-size="12" font-weight="400" fill="#475569" text-anchor="middle">loop until every gate passes, then pin the fix with a regression test</text></svg>
