<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ESP32 Emu Turbo — PCB Net Explorer</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --bg: #0d1117; --panel: #161b22; --line: #30363d;
    --fg: #c9d1d9; --dim: #8b949e; --faint: #484f58;
    --accent: #58a6ff; --accent-solid: #1f6feb;
    --f-cu: #c8442e; --in1: #2ea043; --in2: #d29922; --b-cu: #3d7fd6;
    --warn: #f0883e;
  }
  html, body { height: 100%; }
  body {
    height: 100vh; height: 100dvh;
    background: var(--bg); color: var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    font-size: 13px; overflow: hidden;
    display: flex; flex-direction: column;
  }
  code, .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }

  /* ── header ─────────────────────────────────────────────── */
  header {
    flex: 0 0 auto; display: flex; align-items: center; gap: 14px;
    padding: 9px 14px; background: var(--panel);
    border-bottom: 1px solid var(--line); flex-wrap: wrap;
  }
  header h1 { font-size: 14px; font-weight: 600; white-space: nowrap; }
  header h1 span { color: var(--accent); }
  .grp { display: flex; align-items: center; gap: 5px; }
  .grp > label.tag {
    color: var(--faint); font-size: 10px; text-transform: uppercase;
    letter-spacing: .07em; margin-right: 2px;
  }
  button.tgl {
    background: #21262d; color: var(--fg); border: 1px solid var(--line);
    border-radius: 6px; padding: 4px 10px; font-size: 12px; cursor: pointer;
    transition: .12s; font-family: inherit;
  }
  button.tgl:hover { border-color: var(--accent); }
  button.tgl.on { background: var(--accent-solid); border-color: var(--accent); color: #fff; }
  button.tgl.layer.on { color: #fff; }
  button.tgl[data-layer="F.Cu"].on   { background: var(--f-cu); border-color: var(--f-cu); }
  button.tgl[data-layer="In1.Cu"].on { background: var(--in1);  border-color: var(--in1); }
  button.tgl[data-layer="In2.Cu"].on { background: var(--in2);  border-color: var(--in2); color:#000; }
  button.tgl[data-layer="B.Cu"].on   { background: var(--b-cu); border-color: var(--b-cu); }
  #search {
    background: #0d1117; border: 1px solid var(--line); border-radius: 6px;
    color: var(--fg); padding: 5px 9px; font-size: 12px; width: 210px;
    font-family: ui-monospace, monospace;
  }
  #search:focus { outline: none; border-color: var(--accent); }
  .spacer { flex: 1; }
  .hint { color: var(--faint); font-size: 11px; }

  /* ── layout ─────────────────────────────────────────────── */
  main { flex: 1; display: flex; min-height: 0; }
  #stage { flex: 1; position: relative; min-width: 0; background: #010409; }
  #board { width: 100%; height: 100%; display: block; cursor: grab; }
  #board.drag { cursor: grabbing; }
  #tip {
    position: absolute; pointer-events: none; z-index: 5; display: none;
    background: rgba(22,27,34,.96); border: 1px solid var(--line);
    border-radius: 6px; padding: 5px 8px; font-size: 11px; white-space: nowrap;
    font-family: ui-monospace, monospace;
  }
  #zoombar {
    position: absolute; left: 10px; bottom: 10px; display: flex; gap: 5px; z-index: 4;
  }
  #legend {
    position: absolute; right: 10px; bottom: 10px; z-index: 4;
    background: rgba(22,27,34,.9); border: 1px solid var(--line);
    border-radius: 6px; padding: 7px 10px; font-size: 10px; line-height: 1.75;
  }
  #legend i { display: inline-block; width: 16px; height: 3px; vertical-align: middle;
              margin-right: 6px; border-radius: 2px; }

  /* ── inspector ──────────────────────────────────────────── */
  #side {
    flex: 0 0 380px; background: var(--panel); border-left: 1px solid var(--line);
    overflow-y: auto; padding: 14px;
  }
  #side h2 {
    font-size: 15px; margin-bottom: 2px;
    font-family: ui-monospace, monospace; color: #fff;
  }
  #side .sub { color: var(--dim); font-size: 11px; margin-bottom: 12px; }
  #side h3 {
    font-size: 10px; text-transform: uppercase; letter-spacing: .08em;
    color: var(--faint); margin: 16px 0 7px; padding-bottom: 4px;
    border-bottom: 1px solid var(--line);
  }
  .kv { display: flex; justify-content: space-between; gap: 10px; padding: 2px 0; }
  .kv span:first-child { color: var(--dim); }
  .kv span:last-child { font-family: ui-monospace, monospace; text-align: right; }
  table { width: 100%; border-collapse: collapse; font-size: 12px; }
  th {
    text-align: left; color: var(--faint); font-weight: 500; font-size: 10px;
    text-transform: uppercase; letter-spacing: .05em; padding: 3px 5px;
    border-bottom: 1px solid var(--line);
  }
  td { padding: 4px 5px; border-bottom: 1px solid #21262d; vertical-align: top; }
  tr.clk { cursor: pointer; }
  tr.clk:hover { background: #21262d; }
  .pin { font-family: ui-monospace, monospace; color: var(--dim); }
  .net { font-family: ui-monospace, monospace; color: var(--accent); }
  .net.nc { color: var(--warn); }
  .goes { color: var(--dim); font-size: 11px; line-height: 1.5; }
  .goes b { color: var(--fg); font-weight: 500; }
  .chip {
    display: inline-block; padding: 1px 6px; border-radius: 4px;
    font-size: 10px; font-family: ui-monospace, monospace; margin: 1px 3px 1px 0;
    border: 1px solid var(--line);
  }
  .chip.F { background: rgba(200,68,46,.18); border-color: var(--f-cu); color: #f0a08e; }
  .chip.B { background: rgba(61,127,214,.18); border-color: var(--b-cu); color: #9dc4f5; }
  .chip.L1 { background: rgba(46,160,67,.18); border-color: var(--in1); color: #86d99a; }
  .chip.L2 { background: rgba(210,153,34,.18); border-color: var(--in2); color: #e5c877; }
  .chip.pow { background: rgba(240,136,62,.15); border-color: var(--warn); color: #f5b083; }
  .empty { color: var(--faint); padding: 30px 0; text-align: center; line-height: 1.7; }
  .back {
    background: none; border: none; color: var(--accent); cursor: pointer;
    font-size: 11px; font-family: inherit; padding: 0 0 8px;
  }
  .back:hover { text-decoration: underline; }
  ol.path { list-style: none; counter-reset: s; font-size: 11px; }
  ol.path li {
    counter-increment: s; padding: 4px 0 4px 22px; position: relative;
    font-family: ui-monospace, monospace; color: var(--dim);
    border-bottom: 1px solid #21262d; line-height: 1.5;
  }
  ol.path li .w { color: var(--faint); }
  ol.path li::before {
    content: counter(s); position: absolute; left: 0; top: 3px;
    color: var(--faint); font-size: 10px;
  }
  ol.path li b { color: var(--fg); font-weight: 500; }
  .warnbox {
    background: rgba(240,136,62,.1); border: 1px solid var(--warn);
    border-radius: 6px; padding: 8px 10px; font-size: 11px;
    color: #f5b083; line-height: 1.55; margin-top: 10px;
  }

  /* ── svg ────────────────────────────────────────────────── */
  .outline { stroke: #6e7681; stroke-width: .3; fill: none; }
  .seg { fill: none; stroke-linecap: round; }
  .pad { stroke: #0d1117; stroke-width: .04; }
  .via { fill: #8b949e; }
  .viahole { fill: #010409; }
  .body { fill: rgba(139,148,158,.09); stroke: rgba(139,148,158,.4); stroke-width: .08; }
  .body.sel { fill: rgba(88,166,255,.2); stroke: var(--accent); stroke-width: .22; }
  .reftxt {
    fill: #8b949e; font-size: 1.1px; text-anchor: middle;
    font-family: ui-monospace, monospace; pointer-events: none;
  }
  .hit { fill: transparent; cursor: pointer; }
  #dimmed { opacity: .14; }
  .hl-seg { fill: none; stroke: #fff; stroke-linecap: round; opacity: .95; }
  .hl-pad { fill: none; stroke: #fff; stroke-width: .18; }
  .hl-via { fill: none; stroke: #fff; stroke-width: .12; }
  .hl-via-barrel { stroke: #fff; stroke-width: .22; opacity: .9; }
  .dang { stroke: #f85149; stroke-width: .22; fill: none; }
  #sep { width: 92px; accent-color: var(--accent); }
</style>
</head>
<body>

<header>
  <h1>PCB <span>Net Explorer</span></h1>
  <input id="search" placeholder="ref o net… (U5, PAM_VREF)" autocomplete="off" spellcheck="false">
  <div class="grp">
    <label class="tag">Lato</label>
    <button class="tgl side on" data-side="all">Both</button>
    <button class="tgl side" data-side="F">Front</button>
    <button class="tgl side" data-side="B">Back</button>
  </div>
  <div class="grp">
    <label class="tag">Layer</label>
    <button class="tgl layer on" data-layer="F.Cu">F.Cu</button>
    <button class="tgl layer on" data-layer="In1.Cu">In1</button>
    <button class="tgl layer on" data-layer="In2.Cu">In2</button>
    <button class="tgl layer on" data-layer="B.Cu">B.Cu</button>
  </div>
  <div class="grp">
    <label class="tag">Vista</label>
    <button class="tgl mode on" data-mode="2d">2D</button>
    <button class="tgl mode" data-mode="3d">3D stack</button>
  </div>
  <div class="grp" id="sepgrp" style="display:none">
    <label class="tag">Distanza</label>
    <input type="range" id="sep" min="3" max="30" step="1" value="12">
  </div>
  <button class="tgl" id="flip">Vista da retro</button>
  <button class="tgl on" id="dang">Punti morti</button>
  <div class="spacer"></div>
  <div class="hint" id="stat">…</div>
</header>

<main>
  <div id="stage">
    <svg id="board"></svg>
    <div id="tip"></div>
    <div id="zoombar">
      <button class="tgl" id="zin">+</button>
      <button class="tgl" id="zout">−</button>
      <button class="tgl" id="zfit">Fit</button>
    </div>
    <div id="legend">
      <div><i style="background:var(--f-cu)"></i>F.Cu</div>
      <div><i style="background:var(--in1)"></i>In1.Cu — piano GND (0 piste)</div>
      <div><i style="background:var(--in2)"></i>In2.Cu — piano +3V3/+5V (0 piste)</div>
      <div><i style="background:var(--b-cu)"></i>B.Cu</div>
      <div><i style="background:#f85149"></i>punto morto</div>
      <div style="color:var(--faint);margin-top:4px">3D: trascina = ruota ·
        shift+trascina = sposta</div>
    </div>
  </div>
  <aside id="side"></aside>
</main>

<script>
'use strict';

const LAYER_COLOR = {
  'F.Cu':   getComputedStyle(document.documentElement).getPropertyValue('--f-cu').trim(),
  'In1.Cu': getComputedStyle(document.documentElement).getPropertyValue('--in1').trim(),
  'In2.Cu': getComputedStyle(document.documentElement).getPropertyValue('--in2').trim(),
  'B.Cu':   getComputedStyle(document.documentElement).getPropertyValue('--b-cu').trim(),
};
const LAYER_CHIP = { 'F.Cu': 'F', 'B.Cu': 'B', 'In1.Cu': 'L1', 'In2.Cu': 'L2' };

const svg = document.getElementById('board');
const side = document.getElementById('side');
const tip = document.getElementById('tip');
const NS = 'http://www.w3.org/2000/svg';

let DATA = null;
let netById = new Map(), compByRef = new Map(), padOwner = new Map();
let view = { x: 0, y: 0, w: 160, h: 75 };
let state = { side: 'all', layers: new Set(['F.Cu', 'In1.Cu', 'In2.Cu', 'B.Cu']),
              flip: false, selNet: null, selRef: null,
              mode: '2d', az: -22, el: 34, sep: 12, dangling: true };

const el = (n, a = {}) => { const e = document.createElementNS(NS, n);
  for (const k in a) e.setAttribute(k, a[k]); return e; };
const esc = s => String(s).replace(/[&<>"]/g, c =>
  ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

// ── load ──────────────────────────────────────────────────────
fetch('net-explorer-data.json')
  .then(r => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
  .then(d => { DATA = d; boot(); })
  .catch(e => {
    side.innerHTML = `<div class="empty">Impossibile caricare
      <code>net-explorer-data.json</code>.<br>${esc(e.message)}<br><br>
      Rigenera con <code>make net-explorer</code>.</div>`;
  });

function boot() {
  DATA.nets.forEach(n => netById.set(n.id, n));
  DATA.components.forEach(c => {
    compByRef.set(c.ref, c);
    c.pads.forEach(p => {
      const k = p.net;
      if (!padOwner.has(k)) padOwner.set(k, []);
      padOwner.get(k).push({ ref: c.ref, num: p.num, side: c.side, layer: p.layer });
    });
  });
  const s = DATA.stats || {};
  document.getElementById('stat').textContent =
    `${DATA.components.length} componenti · ${DATA.nets.length} net · ` +
    `${s.segments || 0} piste · ${s.vias || 0} via · rev ${DATA.pcbHash}`;
  fit();
  render();
  showHome();
}

// ── projection ────────────────────────────────────────────────
// One code path serves both views. 2D is simply the 3D camera looking
// straight down (elevation 90°, azimuth 0), where z drops out of the
// equation — so there is no separate "2D renderer" to keep in sync.
//
//   rotate about Z by az, then tilt the camera by el:
//     sx = X'
//     sy = Y'·sin(el) − z·cos(el)
//
// z is the layer depth. The real stackup is 1.6 mm across 4 layers,
// which at board scale is invisible, so 3D mode explodes it — the point
// is to read which layer a track lives on and where a via crosses, not
// to be dimensionally honest about the substrate.
const LAYER_ORDER = ['B.Cu', 'In2.Cu', 'In1.Cu', 'F.Cu'];  // painted back to front
const LAYER_DEPTH = { 'F.Cu': 0, 'In1.Cu': 1, 'In2.Cu': 2, 'B.Cu': 3 };

function layerZ(layer) {
  return state.mode === '3d' ? -LAYER_DEPTH[layer] * state.sep : 0;
}
function project(x, y, z) {
  const c = center();
  const dx = x - c.x, dy = y - c.y;
  if (state.mode !== '3d') return [x, y];
  const a = state.az * Math.PI / 180, e = state.el * Math.PI / 180;
  const X = dx * Math.cos(a) - dy * Math.sin(a);
  const Y = dx * Math.sin(a) + dy * Math.cos(a);
  return [c.x + X, c.y + Y * Math.sin(e) - z * Math.cos(e)];
}
function center() {
  const b = rawBox();
  return { x: (b.x1 + b.x2) / 2, y: (b.y1 + b.y2) / 2 };
}

// ── viewport ──────────────────────────────────────────────────
function rawBox() {
  let x1 = Infinity, y1 = Infinity, x2 = -Infinity, y2 = -Infinity;
  const add = (x, y) => { if (x < x1) x1 = x; if (x > x2) x2 = x;
                          if (y < y1) y1 = y; if (y > y2) y2 = y; };
  DATA.outline.forEach(e => { add(e.x1, e.y1); add(e.x2, e.y2); });
  if (!isFinite(x1)) DATA.components.forEach(c => c.pads.forEach(p => add(p.x, p.y)));
  return { x1, y1, x2, y2 };
}
function bbox() {
  // Project the eight corners of the layer stack, not just the board
  // rectangle — in 3D the tilted lower layers stick out past both.
  const b = rawBox();
  let x1 = Infinity, y1 = Infinity, x2 = -Infinity, y2 = -Infinity;
  [b.x1, b.x2].forEach(x => [b.y1, b.y2].forEach(y =>
    LAYER_ORDER.forEach(l => {
      const [sx, sy] = project(x, y, layerZ(l));
      if (sx < x1) x1 = sx; if (sx > x2) x2 = sx;
      if (sy < y1) y1 = sy; if (sy > y2) y2 = sy;
    })));
  return { x1, y1, x2, y2 };
}
function fit() {
  const b = bbox(), pad = 3;
  view = { x: b.x1 - pad, y: b.y1 - pad,
           w: (b.x2 - b.x1) + pad * 2, h: (b.y2 - b.y1) + pad * 2 };
  applyView();
}
function applyView() {
  svg.setAttribute('viewBox', `${view.x} ${view.y} ${view.w} ${view.h}`);
  svg.setAttribute('preserveAspectRatio', 'xMidYMid meet');
}

// ── render ────────────────────────────────────────────────────
function pline(x1, y1, x2, y2, z, attrs) {
  const [ax, ay] = project(x1, y1, z), [bx, by] = project(x2, y2, z);
  return el('line', Object.assign({ x1: ax, y1: ay, x2: bx, y2: by }, attrs));
}
function ppoly(rings, z, attrs) {
  const d = rings.map(r => 'M ' + r.map(([x, y]) => {
    const [sx, sy] = project(x, y, z); return `${sx.toFixed(3)} ${sy.toFixed(3)}`;
  }).join(' L ') + ' Z').join(' ');
  return el('path', Object.assign({ d, 'fill-rule': 'evenodd' }, attrs));
}
function prect(cx, cy, w, h, z, attrs) {
  // Pads are axis-aligned in board space; under the projection they
  // become parallelograms, so emit the four projected corners.
  const r = [[cx - w / 2, cy - h / 2], [cx + w / 2, cy - h / 2],
             [cx + w / 2, cy + h / 2], [cx - w / 2, cy + h / 2]];
  return ppoly([r], z, attrs);
}
function pcircle(cx, cy, r, z, attrs) {
  const [sx, sy] = project(cx, cy, z);
  const ry = state.mode === '3d'
    ? r * Math.sin(state.el * Math.PI / 180) : r;
  return el('ellipse', Object.assign({ cx: sx, cy: sy, rx: r, ry }, attrs));
}

function render() {
  hideTip();
  while (svg.firstChild) svg.removeChild(svg.firstChild);

  const root = el('g');
  if (state.flip && state.mode !== '3d') {
    const b = rawBox();
    root.setAttribute('transform', `translate(${b.x1 + b.x2} 0) scale(-1 1)`);
  }
  svg.appendChild(root);

  const gDim = el('g', { id: 'dimmed' });
  const gHi = el('g');
  root.appendChild(gDim);
  root.appendChild(gHi);
  const base = state.selNet !== null ? gDim : root;

  // Vias first in 3D: they are the vertical structure the layers hang on,
  // and drawing them under everything keeps the pads readable.
  if (state.mode === '3d') {
    const gVia = el('g', { opacity: .45 });
    DATA.nets.forEach(n => n.vias.forEach(v => {
      const [x0, y0] = project(v.x, v.y, 0);
      const [x1, y1] = project(v.x, v.y, layerZ('B.Cu'));
      gVia.appendChild(el('line', { x1: x0, y1: y0, x2: x1, y2: y1,
        stroke: '#6e7681', 'stroke-width': .12 }));
    }));
    base.appendChild(gVia);
  }

  LAYER_ORDER.forEach(layer => {
    if (!state.layers.has(layer)) return;
    const z = layerZ(layer);
    const col = LAYER_COLOR[layer];
    const g = el('g');

    // board outline repeated per plane — this is what makes the stack read
    if (state.mode === '3d') {
      DATA.outline.forEach(e => {
        if (e.type === 'line') {
          g.appendChild(pline(e.x1, e.y1, e.x2, e.y2, z,
            { class: 'outline', opacity: .5 }));
        } else {
          g.appendChild(pline(e.x1, e.y1, e.x2, e.y2, z,
            { class: 'outline', opacity: .5 }));
        }
      });
    }

    // poured copper (In1/In2 are planes only — no tracks at all)
    DATA.zoneFills.filter(f => f.layer === layer).forEach(f => {
      g.appendChild(ppoly([f.outer, ...f.holes], z, {
        fill: col, opacity: .16, stroke: col,
        'stroke-width': .06, 'stroke-opacity': .5 }));
    });

    // tracks
    DATA.nets.forEach(n => n.segments.forEach(s => {
      if (s.layer !== layer) return;
      g.appendChild(pline(s.x1, s.y1, s.x2, s.y2, z, {
        class: 'seg', stroke: col, opacity: .85, 'stroke-width': s.width }));
    }));

    // pads on this layer
    DATA.components.forEach(c => {
      if (state.side !== 'all' && c.side !== state.side) return;
      c.pads.forEach(p => {
        if (p.layer !== layer) return;
        g.appendChild(prect(p.x, p.y, p.w, p.h, z, { class: 'pad', fill: col }));
        if (p.drill > 0) g.appendChild(pcircle(p.x, p.y, p.drill / 2, z,
          { class: 'viahole' }));
      });
    });

    // via annulus on this plane
    DATA.nets.forEach(n => n.vias.forEach(v => {
      g.appendChild(pcircle(v.x, v.y, v.size / 2, z, { class: 'via' }));
      g.appendChild(pcircle(v.x, v.y, v.drill / 2, z, { class: 'viahole' }));
    }));

    base.appendChild(g);
  });

  // 2D-only chrome: single outline, component bodies, refs, click targets
  if (state.mode !== '3d') {
    const gO = el('g');
    DATA.outline.forEach(e => {
      if (e.type === 'line') {
        gO.appendChild(el('line', { class: 'outline',
          x1: e.x1, y1: e.y1, x2: e.x2, y2: e.y2 }));
      } else {
        gO.appendChild(el('path', { class: 'outline',
          d: arcPath(e.x1, e.y1, e.xm, e.ym, e.x2, e.y2) }));
      }
    });
    base.appendChild(gO);
  }

  const gC = el('g');
  DATA.components.forEach(c => {
    if (state.side !== 'all' && c.side !== state.side) return;
    const bb = padBox(c);
    if (!bb) return;
    const z = layerZ(c.side === 'B' ? 'B.Cu' : 'F.Cu');
    const g = el('g');

    g.appendChild(ppoly([[[bb.x1 - .2, bb.y1 - .2], [bb.x2 + .2, bb.y1 - .2],
                          [bb.x2 + .2, bb.y2 + .2], [bb.x1 - .2, bb.y2 + .2]]],
      z, { class: 'body' + (state.selRef === c.ref ? ' sel' : '') }));

    if ((bb.x2 - bb.x1) > 2.2) {
      const [tx, ty] = project((bb.x1 + bb.x2) / 2, bb.y1 - .5, z);
      const t = el('text', { class: 'reftxt', x: tx, y: ty });
      t.textContent = c.ref;
      if (state.flip && state.mode !== '3d')
        t.setAttribute('transform', `translate(${(bb.x1 + bb.x2)} 0) scale(-1 1)`);
      g.appendChild(t);
    }

    const hit = ppoly([[[bb.x1 - .4, bb.y1 - .4], [bb.x2 + .4, bb.y1 - .4],
                        [bb.x2 + .4, bb.y2 + .4], [bb.x1 - .4, bb.y2 + .4]]],
      z, { class: 'hit' });
    hit.addEventListener('click', ev => { ev.stopPropagation(); selectRef(c.ref); });
    hit.addEventListener('mousemove', ev => showTip(ev,
      `${c.ref}${c.value ? ' · ' + c.value : ''} · ${c.side === 'F' ? 'fronte' : 'retro'}`));
    hit.addEventListener('mouseleave', hideTip);
    g.appendChild(hit);
    gC.appendChild(g);
  });
  base.appendChild(gC);

  // dangling copper — always on top, never dimmed: it is a defect marker
  if (state.dangling && DATA.danglingEnds) {
    const gD = el('g');
    DATA.danglingEnds.forEach(d => {
      const z = layerZ(d.layer);
      const [sx, sy] = project(d.x, d.y, z);
      gD.appendChild(el('circle', { class: 'dang', cx: sx, cy: sy, r: .9 }));
      gD.appendChild(el('line', { class: 'dang', x1: sx - 1.4, y1: sy - 1.4,
        x2: sx + 1.4, y2: sy + 1.4 }));
      gD.appendChild(el('line', { class: 'dang', x1: sx + 1.4, y1: sy - 1.4,
        x2: sx - 1.4, y2: sy + 1.4 }));
    });
    root.appendChild(gD);
  }

  // highlighted net, drawn on top of the dimmed board
  if (state.selNet !== null) {
    const n = netById.get(state.selNet);
    if (n) {
      n.segments.forEach(s => {
        const z = layerZ(s.layer);
        gHi.appendChild(pline(s.x1, s.y1, s.x2, s.y2, z, { class: 'hl-seg',
          stroke: '#fff', opacity: .35,
          'stroke-width': Math.max(s.width, .25) + .18 }));
        gHi.appendChild(pline(s.x1, s.y1, s.x2, s.y2, z, { class: 'hl-seg',
          stroke: LAYER_COLOR[s.layer] || '#fff',
          'stroke-width': Math.max(s.width, .25) }));
      });
      // In 3D a via is the interesting part: it is where the net changes
      // layer, so draw the whole barrel rather than a ring per plane.
      n.vias.forEach(v => {
        if (state.mode === '3d') {
          const [x0, y0] = project(v.x, v.y, 0);
          const [x1, y1] = project(v.x, v.y, layerZ('B.Cu'));
          gHi.appendChild(el('line', { class: 'hl-via-barrel',
            x1: x0, y1: y0, x2: x1, y2: y1 }));
        }
        LAYER_ORDER.forEach(l => {
          if (state.mode !== '3d' && l !== 'F.Cu') return;
          gHi.appendChild(pcircle(v.x, v.y, v.size / 2 + .1, layerZ(l),
            { class: 'hl-via' }));
        });
      });
      n.pads.forEach(p => {
        const c = compByRef.get(p.ref);
        const pd = c && c.pads.find(q => String(q.num) === String(p.num));
        const r = pd ? Math.max(pd.w, pd.h) / 2 + .18 : .5;
        gHi.appendChild(pcircle(p.x, p.y, r, layerZ(p.layer), { class: 'hl-pad' }));
      });
    }
  }
}

function arcPath(x1, y1, xm, ym, x2, y2) {
  // circle through the three points -> single SVG arc
  const a = 2 * (xm - x1), b = 2 * (ym - y1);
  const c = xm * xm + ym * ym - x1 * x1 - y1 * y1;
  const d = 2 * (x2 - xm), e = 2 * (y2 - ym);
  const f = x2 * x2 + y2 * y2 - xm * xm - ym * ym;
  const det = a * e - b * d;
  if (Math.abs(det) < 1e-9) return `M ${x1} ${y1} L ${x2} ${y2}`;
  const cx = (c * e - b * f) / det, cy = (a * f - c * d) / det;
  const r = Math.hypot(x1 - cx, y1 - cy);
  const cross = (xm - x1) * (y2 - y1) - (ym - y1) * (x2 - x1);
  const sweep = cross > 0 ? 0 : 1;
  return `M ${x1} ${y1} A ${r} ${r} 0 0 ${sweep} ${x2} ${y2}`;
}

function padBox(c) {
  if (!c.pads.length) return null;
  let x1 = Infinity, y1 = Infinity, x2 = -Infinity, y2 = -Infinity;
  c.pads.forEach(p => {
    x1 = Math.min(x1, p.x - p.w / 2); x2 = Math.max(x2, p.x + p.w / 2);
    y1 = Math.min(y1, p.y - p.h / 2); y2 = Math.max(y2, p.y + p.h / 2);
  });
  return { x1, y1, x2, y2 };
}
// ── inspector ─────────────────────────────────────────────────
function showHome() {
  const front = DATA.components.filter(c => c.side === 'F');
  const back = DATA.components.filter(c => c.side === 'B');
  const list = arr => arr.map(c =>
    `<span class="chip ${c.side} clkref" data-ref="${esc(c.ref)}"
      style="cursor:pointer">${esc(c.ref)}</span>`).join('');

  side.innerHTML = `
    <h2>Board</h2>
    <div class="sub">${esc(DATA.generatedFrom)} · rev ${esc(DATA.pcbHash)}</div>
    <div class="kv"><span>Componenti</span><span>${DATA.components.length}</span></div>
    <div class="kv"><span>Net</span><span>${DATA.nets.length}</span></div>
    <div class="kv"><span>Piste</span><span>${(DATA.stats || {}).segments || 0}</span></div>
    <div class="kv"><span>Via</span><span>${(DATA.stats || {}).vias || 0}</span></div>
    <h3>Fronte — F.Cu (${front.length})</h3><div>${list(front)}</div>
    <h3>Retro — B.Cu (${back.length})</h3><div>${list(back)}</div>

    <h3>Layer</h3>
    <table><thead><tr><th>Layer</th><th>Piste</th><th>Piano</th></tr></thead><tbody>
    ${DATA.copperLayers.map(l => {
      const segs = DATA.nets.reduce((a, n) =>
        a + n.segments.filter(s => s.layer === l).length, 0);
      const z = DATA.zoneFills.filter(f => f.layer === l);
      return `<tr>
        <td><span class="chip ${LAYER_CHIP[l] || ''}">${esc(l)}</span></td>
        <td class="mono">${segs || '—'}</td>
        <td class="goes">${z.length
          ? z.map(f => `${esc(f.net)} ${f.area} mm²`).join('<br>')
          : '—'}</td></tr>`;
    }).join('')}
    </tbody></table>
    <div class="goes" style="margin-top:8px">
      In1.Cu e In2.Cu non hanno <b>nessuna pista</b>: sono piani pieni.
      Tutto il routing sta su F.Cu e B.Cu, e le via sono l'unico modo in
      cui una net raggiunge i piani interni. Guardalo in <b>3D stack</b>.
    </div>

    ${(DATA.danglingEnds || []).length ? `
    <h3>Punti morti (${DATA.danglingEnds.length})</h3>
    <div class="warnbox">Rame che finisce in aria: l'estremo non tocca
      nessun pad, via, giunzione o piano. Nessun altro controllo li vede —
      <code>verify_net_connectivity</code> chiede se la net è UN pezzo solo,
      e un moncone attaccato da un lato lo è.</div>
    <table><thead><tr><th>Net</th><th>Layer</th><th>Posizione</th></tr></thead><tbody>
    ${DATA.danglingEnds.map(d => `<tr class="clk clknet" data-net="${d.netId}">
      <td class="net">${esc(d.net)}</td>
      <td><span class="chip ${LAYER_CHIP[d.layer] || ''}">${esc(d.layer.replace('.Cu', ''))}</span></td>
      <td class="mono">${d.x.toFixed(2)}, ${d.y.toFixed(2)}</td></tr>`).join('')}
    </tbody></table>` : ''}
    <h3>Net per lunghezza</h3>
    <table><thead><tr><th>Net</th><th>Layer</th><th>mm</th><th>Pad</th></tr></thead><tbody>
    ${DATA.nets.slice().sort((a, b) => b.length - a.length).slice(0, 18).map(n => `
      <tr class="clk clknet" data-net="${n.id}">
        <td class="net">${esc(n.name)}</td>
        <td>${n.layers.map(l => `<span class="chip ${LAYER_CHIP[l] || ''}">${esc(l.replace('.Cu', ''))}</span>`).join('')}</td>
        <td class="mono">${n.length.toFixed(1)}</td>
        <td class="mono">${n.pads.length}</td>
      </tr>`).join('')}
    </tbody></table>
    <div class="empty" style="padding:18px 0">
      Clicca un componente sulla board, o cercalo per sigla.
    </div>`;
  wire();
}

function selectRef(ref) {
  const c = compByRef.get(ref);
  if (!c) return;
  state.selRef = ref; state.selNet = null;
  render();

  // A power net touches most of the board. Listing all 80 destinations
  // inline buries the signal nets, which are the ones worth reading pin
  // by pin — so cap it and send the reader to the net view for the rest.
  const CAP = 12;
  const rows = c.pads.map(p => {
    const n = p.net ? netById.get(p.net) : null;
    const others = n ? n.pads.filter(q => q.ref !== ref) : [];
    const shown = others.slice(0, CAP)
      .map(q => `<b>${esc(q.ref)}</b>.${esc(q.num)}`).join(', ');
    const dest = others.length
      ? shown + (others.length > CAP
          ? ` <span style="color:var(--accent)">+${others.length - CAP} altri —
              apri la net</span>` : '')
      : '<i>nessun altro pad — solo zona/piano</i>';
    return `<tr class="clk ${n ? 'clknet' : ''}" ${n ? `data-net="${n.id}"` : ''}>
      <td class="pin">${esc(p.num)}</td>
      <td>${n ? `<span class="net">${esc(n.name)}</span>` :
                `<span class="net nc">— non connesso —</span>`}
        <div class="goes">${n ? '→ ' + dest : ''}</div></td>
      <td><span class="chip ${LAYER_CHIP[p.layer] || ''}">${esc(p.layer.replace('.Cu', ''))}</span></td>
    </tr>`;
  }).join('');

  const nc = c.pads.filter(p => !p.net).length;
  side.innerHTML = `
    <button class="back" id="home">← tutta la board</button>
    <h2>${esc(c.ref)}</h2>
    <div class="sub">${esc(c.value || '—')} · ${esc(c.footprint)}</div>
    <div class="kv"><span>Lato</span><span>${c.side === 'F' ? 'Fronte (F.Cu)' : 'Retro (B.Cu)'}</span></div>
    <div class="kv"><span>Posizione</span><span>${c.x.toFixed(2)}, ${c.y.toFixed(2)} mm</span></div>
    <div class="kv"><span>Rotazione</span><span>${c.rot}°</span></div>
    <div class="kv"><span>Pad</span><span>${c.pads.length}</span></div>
    <h3>Pin → dove va</h3>
    <table><thead><tr><th>Pin</th><th>Net e destinazioni</th><th>Layer</th></tr></thead>
    <tbody>${rows}</tbody></table>
    ${nc ? `<div class="warnbox"><b>${nc} pad senza net.</b> Sono pad meccanici
      (guscio, fori di fissaggio) oppure pin volutamente non collegati —
      controlla il pinout in <code>datasheet_specs.py</code> prima di
      considerarlo un difetto.</div>` : ''}
    <h3>Net toccate</h3>
    <div>${[...new Set(c.pads.filter(p => p.net).map(p => p.net))]
      .map(id => netById.get(id))
      .filter(Boolean)
      .map(n => `<span class="chip ${n.type === 'power' || n.type === 'gnd' ? 'pow' : ''}
        clknet" data-net="${n.id}" style="cursor:pointer">${esc(n.name)}</span>`).join('')}</div>`;
  wire();
}

function selectNet(id) {
  const n = netById.get(id);
  if (!n) return;
  state.selNet = id;
  render();

  const byRef = {};
  n.pads.forEach(p => { (byRef[p.ref] = byRef[p.ref] || []).push(p.num); });

  const byLayer = {};
  n.segments.forEach(s => {
    const L = (byLayer[s.layer] = byLayer[s.layer] || { n: 0, len: 0, w: new Set() });
    L.n++; L.len += Math.hypot(s.x2 - s.x1, s.y2 - s.y1); L.w.add(s.width);
  });

  const path = n.segments.map(s =>
    `<li><b>${esc(s.layer.replace('.Cu', ''))}</b> ` +
    `(${s.x1.toFixed(2)}, ${s.y1.toFixed(2)}) → (${s.x2.toFixed(2)}, ${s.y2.toFixed(2)})` +
    `<br><span class="w">${Math.hypot(s.x2 - s.x1, s.y2 - s.y1).toFixed(2)} mm ` +
    `· larghezza ${s.width} mm</span></li>`).join('');

  side.innerHTML = `
    <button class="back" id="home">← tutta la board</button>
    <h2>${esc(n.name)}</h2>
    <div class="sub">net #${n.id} · ${esc(n.type)}</div>
    <div class="kv"><span>Pad sulla net</span><span>${n.pads.length}</span></div>
    <div class="kv"><span>Segmenti</span><span>${n.segments.length}</span></div>
    <div class="kv"><span>Via</span><span>${n.vias.length}</span></div>
    <div class="kv"><span>Rame totale</span><span>${n.length.toFixed(2)} mm</span></div>
    ${n.zoneLayers.length ? `<div class="kv"><span>Piano</span>
      <span>${n.zoneLayers.map(l => esc(l)).join(', ')}</span></div>` : ''}

    <h3>Chi ci sta sopra (${Object.keys(byRef).length} componenti)</h3>
    <table><thead><tr><th>Componente</th><th>Pin</th><th>Lato</th></tr></thead><tbody>
    ${Object.keys(byRef).sort().map(ref => {
      const c = compByRef.get(ref);
      return `<tr class="clk clkref" data-ref="${esc(ref)}">
        <td><b>${esc(ref)}</b> <span class="goes">${esc(c ? c.value : '')}</span></td>
        <td class="pin">${byRef[ref].map(esc).join(', ')}</td>
        <td><span class="chip ${c ? c.side : ''}">${c ? (c.side === 'F' ? 'fronte' : 'retro') : '?'}</span></td>
      </tr>`; }).join('')}
    </tbody></table>

    <h3>Rame per layer</h3>
    <table><thead><tr><th>Layer</th><th>Segm.</th><th>mm</th><th>Larghezza</th></tr></thead><tbody>
    ${Object.keys(byLayer).map(l => `<tr>
      <td><span class="chip ${LAYER_CHIP[l] || ''}">${esc(l.replace('.Cu', ''))}</span></td>
      <td class="mono">${byLayer[l].n}</td>
      <td class="mono">${byLayer[l].len.toFixed(2)}</td>
      <td class="mono">${[...byLayer[l].w].sort((a, b) => a - b).join(' / ')}</td>
    </tr>`).join('')}
    ${n.vias.length ? `<tr><td colspan="4" class="goes">
      ${n.vias.length} via passanti — ogni cambio di layer avviene qui</td></tr>` : ''}
    </tbody></table>

    ${n.zoneLayers.length ? `<div class="warnbox">Questa net ha un
      <b>piano di rame</b> su ${n.zoneLayers.map(esc).join(', ')}. Parte della
      connessione non passa dalle piste elencate sotto: arriva dal piano
      attraverso le via. Le piste qui sotto sono solo il rame instradato
      esplicitamente.</div>` : ''}

    <h3>Percorso pista (${n.segments.length} segmenti)</h3>
    <ol class="path">${path || '<li>nessuna pista — solo piano</li>'}</ol>`;
  wire();
}

function wire() {
  const h = document.getElementById('home');
  if (h) h.addEventListener('click', () => {
    state.selNet = null; state.selRef = null; render(); showHome();
  });
  side.querySelectorAll('.clknet').forEach(e =>
    e.addEventListener('click', ev => { ev.stopPropagation();
      selectNet(+e.dataset.net); }));
  side.querySelectorAll('.clkref').forEach(e =>
    e.addEventListener('click', ev => { ev.stopPropagation();
      selectRef(e.dataset.ref); }));
}

// ── tooltip ───────────────────────────────────────────────────
function showTip(ev, text) {
  const r = document.getElementById('stage').getBoundingClientRect();
  tip.textContent = text;
  tip.style.display = 'block';
  tip.style.left = (ev.clientX - r.left + 12) + 'px';
  tip.style.top = (ev.clientY - r.top + 12) + 'px';
}
function hideTip() { tip.style.display = 'none'; }

// ── controls ──────────────────────────────────────────────────
document.querySelectorAll('.tgl.side').forEach(b =>
  b.addEventListener('click', () => {
    document.querySelectorAll('.tgl.side').forEach(o => o.classList.remove('on'));
    b.classList.add('on'); state.side = b.dataset.side; render();
  }));
document.querySelectorAll('.tgl.layer').forEach(b =>
  b.addEventListener('click', () => {
    const l = b.dataset.layer;
    if (state.layers.has(l)) { state.layers.delete(l); b.classList.remove('on'); }
    else { state.layers.add(l); b.classList.add('on'); }
    render();
  }));
document.getElementById('flip').addEventListener('click', e => {
  state.flip = !state.flip; e.target.classList.toggle('on', state.flip); render();
});
document.getElementById('dang').addEventListener('click', e => {
  state.dangling = !state.dangling;
  e.target.classList.toggle('on', state.dangling); render();
});
document.querySelectorAll('.tgl.mode').forEach(b =>
  b.addEventListener('click', () => {
    document.querySelectorAll('.tgl.mode').forEach(o => o.classList.remove('on'));
    b.classList.add('on');
    state.mode = b.dataset.mode;
    document.getElementById('sepgrp').style.display =
      state.mode === '3d' ? 'flex' : 'none';
    document.getElementById('flip').style.display =
      state.mode === '3d' ? 'none' : '';
    fit(); render();
  }));
document.getElementById('sep').addEventListener('input', e => {
  state.sep = +e.target.value; fit(); render();
});
document.getElementById('zin').addEventListener('click', () => zoom(1 / 1.3));
document.getElementById('zout').addEventListener('click', () => zoom(1.3));
document.getElementById('zfit').addEventListener('click', fit);

function zoom(k, cx, cy) {
  cx = cx ?? view.x + view.w / 2;
  cy = cy ?? view.y + view.h / 2;
  const w = Math.min(Math.max(view.w * k, 1.5), 600);
  const s = w / view.w;
  view = { x: cx - (cx - view.x) * s, y: cy - (cy - view.y) * s,
           w, h: view.h * s };
  applyView();
}

svg.addEventListener('wheel', ev => {
  ev.preventDefault();
  const p = toBoard(ev);
  zoom(ev.deltaY > 0 ? 1.12 : 1 / 1.12, p.x, p.y);
}, { passive: false });

let drag = null;
svg.addEventListener('mousedown', ev => {
  // In 3D the natural drag is orbiting the stack; hold Shift to pan.
  const rotating = state.mode === '3d' && !ev.shiftKey;
  drag = { x: ev.clientX, y: ev.clientY, vx: view.x, vy: view.y,
           az: state.az, el: state.el, rotating };
  svg.classList.add('drag');
});
window.addEventListener('mousemove', ev => {
  if (!drag) return;
  if (drag.rotating) {
    state.az = drag.az + (ev.clientX - drag.x) * 0.35;
    // Clamp elevation: at 0° the planes collapse into lines, at 90° the
    // stack collapses into the 2D view — neither is a useful 3D read.
    state.el = Math.min(85, Math.max(8, drag.el - (ev.clientY - drag.y) * 0.3));
    render();
    return;
  }
  const r = svg.getBoundingClientRect();
  const sx = view.w / r.width, sy = view.h / r.height;
  view.x = drag.vx - (ev.clientX - drag.x) * sx
           * (state.flip && state.mode !== '3d' ? -1 : 1);
  view.y = drag.vy - (ev.clientY - drag.y) * sy;
  applyView();
});
let dragged = false;
window.addEventListener('mousemove', () => { if (drag) dragged = true; });
window.addEventListener('mouseup', () => { drag = null; svg.classList.remove('drag'); });
svg.addEventListener('click', () => {
  // A drag ends in a click event; without this, orbiting the 3D stack
  // would clear the selection every time you let go.
  if (dragged) { dragged = false; return; }
  if (state.selNet !== null || state.selRef !== null) {
    state.selNet = null; state.selRef = null; render(); showHome();
  }
});

function toBoard(ev) {
  const r = svg.getBoundingClientRect();
  return { x: view.x + (ev.clientX - r.left) / r.width * view.w,
           y: view.y + (ev.clientY - r.top) / r.height * view.h };
}

document.getElementById('search').addEventListener('input', e => {
  const q = e.target.value.trim().toUpperCase();
  if (!q) return;
  const c = DATA.components.find(x => x.ref.toUpperCase() === q);
  if (c) return selectRef(c.ref);
  const n = DATA.nets.find(x => x.name.toUpperCase() === q);
  if (n) return selectNet(n.id);
});
document.getElementById('search').addEventListener('keydown', e => {
  if (e.key !== 'Enter') return;
  const q = e.target.value.trim().toUpperCase();
  const c = DATA.components.find(x => x.ref.toUpperCase().includes(q));
  if (c) return selectRef(c.ref);
  const n = DATA.nets.find(x => x.name.toUpperCase().includes(q));
  if (n) selectNet(n.id);
});
</script>
