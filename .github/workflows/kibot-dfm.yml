name: KiBot DFM (DRC + ERC + design report)

on:
  push:
    branches: [main]
    paths:
      - 'hardware/kicad/**'
      - '.github/workflows/kibot-dfm.yml'
  pull_request:
    paths:
      - 'hardware/kicad/**'
      - '.github/workflows/kibot-dfm.yml'
  # Manual trigger: the d450403 push (R32 copper widening) started no
  # workflow run at all — pushes made with certain credentials do not
  # trigger push events, and this gate is the one DRC that cannot run
  # locally (0.2 mm netclass, the 4d0749e blind spot). This makes it
  # runnable on demand so a silent no-run can never leave the board
  # unverified again.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kibot-dfm-${{ github.ref }}
  cancel-in-progress: true

jobs:
  kibot:
    runs-on: ubuntu-latest
    # Same base as docker/kibot/Dockerfile — keep the two in sync.
    container: ghcr.io/inti-cmnb/kicad10_auto:latest
    steps:
      - uses: actions/checkout@v4

      - name: Run KiBot (DRC + ERC + report + BOM)
        working-directory: hardware/kicad
        run: |
          mkdir -p /output
          kibot \
            -b esp32-emu-turbo.kicad_pcb \
            -e esp32-emu-turbo.kicad_sch \
            -c external-dfm.kibot.yaml \
            -v 2>&1 | tee /output/kibot.log

      - name: Fail on non-IPC references
        # Regression guard: KiBot hard-rejects refs that are not
        # PREFIX+NUMBER (upstream #604) and that failure silently skips
        # ERC + BOM. All refs were made IPC in July 2026.
        run: |
          if grep -q "Malformed component reference" /output/kibot.log; then
            echo "::error::KiBot rejected a non-IPC reference — see kibot.log"
            exit 1
          fi

      - name: Fail on DRC/ERC errors
        run: |
          python3 - <<'EOF'
          import json, glob, sys
          reports = glob.glob('/output/**/*drc*.json', recursive=True) + \
                    glob.glob('/output/**/*erc*.json', recursive=True)
          if not reports:
              print('No DRC/ERC JSON produced — treating as failure')
              sys.exit(1)
          failed = False
          for path in reports:
              with open(path) as f:
                  data = json.load(f)
              violations = data.get('violations', [])
              for sheet in data.get('sheets', []):
                  violations += sheet.get('violations', [])
              errors = [v for v in violations if v.get('severity') == 'error']
              print(f'{path}: {len(errors)} errors / {len(violations)} findings')
              if errors:
                  failed = True
          sys.exit(1 if failed else 0)
          EOF

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kibot-dfm-reports
          path: /output
          if-no-files-found: warn
